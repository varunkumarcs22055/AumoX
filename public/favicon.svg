<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0DDA0"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8941F"/>
    </linearGradient>
  </defs>
  <!-- Dark rounded background so the gold pops at tiny sizes -->
  <rect width="64" height="64" rx="14" fill="#0A0A0A"/>
  <!-- Floating dot -->
  <circle cx="32" cy="10" r="3" fill="url(#g)"/>
  <!-- Bold ring -->
  <circle cx="32" cy="36" r="18" fill="none" stroke="url(#g)" stroke-width="3.5"/>
  <!-- Bold A inside (two thick diagonals + center dot) -->
  <path d="M 22 48 L 32 22 L 42 48" stroke="url(#g)" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="42" r="2" fill="url(#g)"/>
</svg>
