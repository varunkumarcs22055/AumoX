<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4E4B0"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8941F"/>
    </linearGradient>
  </defs>
  <!-- Dark rounded tile so the gold logo pops at tiny sizes -->
  <rect width="64" height="64" rx="13" fill="#0A0A0A"/>
  <!-- Floating dot (top of the orbit) -->
  <circle cx="32" cy="8.5" r="3.4" fill="url(#g)"/>
  <!-- Orbit ring — large, fills the frame -->
  <circle cx="32" cy="35" r="22" fill="none" stroke="url(#g)" stroke-width="3.6"/>
  <!-- The A — bold diagonals + center dot -->
  <path d="M 20.5 49 L 32 20.5 L 43.5 49" fill="none" stroke="url(#g)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="43.5" r="2.4" fill="url(#g)"/>
</svg>
